AWSTemplateFormatVersion: 2010-09-09
Description: EC2 Instance for web tier and DynamoDB Table for database tier
Parameters:
  LatestAmiId:
    Description: The latest Amazon Linux 2023 AMI from the Parameter Store #Support for Linux 2 has endedUse Linux 2023 AMI as Linux 2 support has ended
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: '/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64' 
  InstanceType:
    Description: WebServer EC2 instance type
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
    ConstraintDescription: must be a valid EC2 instance type.
    
  MyIP:
    Description: Your IP address in CIDR format (e.g. 203.0.113.1/32).
    Type: String
    MinLength: '9'
    MaxLength: '18'
    Default: 0.0.0.0/0
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}\/\d{1,2}$'
    ConstraintDescription: must be a valid IP CIDR range of the form x.x.x.x/x.
Resources: 
  NatureWatchTable: 
    Type: AWS::DynamoDB::Table 
    Properties: 
      AttributeDefinitions: 
        - AttributeName: "Category" 
          AttributeType: "S" 
      KeySchema: 
        - AttributeName: "Category" 
          KeyType: "HASH" 
      BillingMode: PAY_PER_REQUEST #low traffic - no autoscaling or provisioned capacity required
  WebServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP access via my IP address
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref MyIP 
  WebServer:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      SecurityGroupIds:
        - !Ref WebServerSecurityGroup
      UserData: !Base64 |
        #!/bin/bash
        yum update -y
        yum install -y httpd
        systemctl start httpd
        systemctl enable httpd
        echo "<html><body><h1>Nature Watch</h1><search><form><label for ="category">Enter Category </label><input type="text" id="category" placeholder="Category e.g. Birds"><button type = "button">Enter</button></form></search><p id= "result" hidden>There have been <span id= "count"></span> sightings of <span id="SelectedCategory"></span>. </p></body></html>" > /var/www/html/index.html
Outputs:
  WebsiteURL:
    Value: !Join
      - ''
      - - http://
        - !GetAtt WebServer.PublicDnsName
    Description: Website URL
        
